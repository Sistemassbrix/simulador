map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    return 444;
}

server {
    listen 80;
    server_name app.nexust.com;

    location / {
        proxy_pass http://conten-nexust:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name db.nexust.com;

    location / {
        proxy_pass http://host.docker.internal:54323;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.nexust.com;

    location / {
        proxy_pass http://host.docker.internal:54321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name app.ibesweb.local;

    location / {
        proxy_pass http://172.16.2.181:81;

        # La conexión debe fallar rápido si el ERP está caído, pero las
        # consultas ya establecidas pueden tardar hasta diez minutos.
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80;
    server_name ollama.nexust.com;

    location / {
        proxy_pass http://172.16.2.181:11434;
        proxy_http_version 1.1;

        # Ollama puede tardar en generar, pero no en aceptar la conexión.
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Necesario para entregar el texto generado de forma progresiva.
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name hikvision.nexust.com;

    location = /hikvision/events {
        allow 172.16.4.1;
        allow 172.16.4.49;
        allow 172.16.4.29;
        allow 172.16.4.181;
        allow 172.21.0.1;
        allow 172.16.4.181;
        deny all;

        proxy_pass http://hikvision-bridge:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        proxy_pass http://hikvision-bridge:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name app.simulador.local;
    location / {
        proxy_pass http://host.docker.internal:8282;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
