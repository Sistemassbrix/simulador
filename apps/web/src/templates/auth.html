<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5" style="max-width: 480px; width: 100%;">

            <div class="card border-0 shadow-lg" style="background: rgba(255, 255, 255, 0.98); border-radius: 1.5rem; padding: 2.5rem 2.25rem; box-shadow: 0 15px 35px rgba(0,0,0,0.18) !important;">
                <div class="text-center mb-4">
                    <img src="/logo.png" alt="Super Simulador" class="img-fluid mb-2" style="max-height: 85px; width: auto; object-fit: contain;">
                    <p class="small mb-0 fw-bold" style="color: #333333; letter-spacing: 0.5px;">Plataforma Avanzada Multigrano</p>
                </div>

                <div class="tab-content" id="authTabsContent">
                    <div id="auth-alert" class="alert d-none py-2 mb-3" role="alert"></div>

                    <!-- Login -->
                    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                        <form id="form-login">
                            <input type="hidden" name="action" value="login">
                            <div class="mb-3 text-start">
                                <label for="login-usuario" class="form-label fw-bold text-secondary mb-1" style="font-size: 0.92rem;">Usuario o Cédula</label>
                                <input type="text" class="form-control form-control-lg bg-white" id="login-usuario" name="usuario" required
                                    placeholder="Ej: admin o 12345678" style="border-radius: 0.75rem; border: 1.5px solid #d1d5db; font-size: 0.95rem; padding: 0.8rem 1.1rem; width: 100%;">
                            </div>
                            <div class="mb-4 text-start">
                                <label for="login-password" class="form-label fw-bold text-secondary mb-1" style="font-size: 0.92rem;">Contraseña</label>
                                <input type="password" class="form-control form-control-lg bg-white" id="login-password" name="password" required
                                    placeholder="••••••••" style="border-radius: 0.75rem; border: 1.5px solid #d1d5db; font-size: 0.95rem; padding: 0.8rem 1.1rem; width: 100%;">
                            </div>
                            <div class="d-grid mb-2">
                                <button type="submit" class="btn btn-lg shadow-sm fw-bold text-white" id="btn-login" style="background-color: #F3912D; border: none; border-radius: 0.75rem; padding: 0.85rem; font-size: 1.05rem; transition: all 0.2s ease;">
                                    <span class="spinner-border spinner-border-sm d-none me-2" role="status"
                                        aria-hidden="true"></span>
                                    Ingresar al Simulador
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Register -->
                    <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                        <form id="form-register">
                            <input type="hidden" name="action" value="register">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="reg-nombre" class="form-label fw-bold small text-secondary">Nombre Completo</label>
                                    <input type="text" class="form-control" id="reg-nombre" name="nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="reg-cedula" class="form-label fw-bold small text-secondary">Cédula</label>
                                    <input type="text" class="form-control" id="reg-cedula" name="cedula" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="reg-usuario" class="form-label fw-bold small text-secondary">Usuario</label>
                                    <input type="text" class="form-control" id="reg-usuario" name="usuario" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="reg-cargo" class="form-label fw-bold small text-secondary">Cargo</label>
                                    <select class="form-control" id="reg-cargo" name="cargo" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Operador">Operador</option>
                                        <option value="Ingeniero">Ingeniero de Procesos</option>
                                        <option value="Auxiliar de sistemas">Auxiliar de sistemas</option>
                                        <option value="Administrador">Administrador</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="reg-correo" class="form-label fw-bold small text-secondary">Correo Electrónico</label>
                                <input type="email" class="form-control" id="reg-correo" name="correo" required>
                            </div>
                            <div class="mb-4">
                                <label for="reg-password" class="form-label fw-bold small text-secondary">Contraseña</label>
                                <input type="password" class="form-control" id="reg-password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm fw-bold" id="btn-register" style="border-radius: 0.75rem; padding: 0.85rem; background-color: #F3912D; border: none;">
                                    <span class="spinner-border spinner-border-sm d-none me-2" role="status"
                                        aria-hidden="true"></span>
                                    Crear Cuenta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <p class="small mb-0" style="color: rgba(255, 255, 255, 0.95); text-shadow: 0 1px 3px rgba(0,0,0,0.6); font-weight: 500;">
                    &copy; 2026 Simulador de Secado Multigrano. Todos los derechos reservados.
                </p>
            </div>

        </div>
    </div>
</div>
