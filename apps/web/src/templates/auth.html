

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: var(--primary-color);">Simulador Secado</h2>
                    <p class="text-muted">Plataforma Avanzada Multigrano</p>
                </div>

                <div class="tab-content" id="authTabsContent">
                    <div id="auth-alert" class="alert d-none" role="alert"></div>

                    <!-- Login -->
                    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                        <form id="form-login">
                            <input type="hidden" name="action" value="login">
                            <div class="mb-3">
                                <label for="login-usuario" class="form-label">Usuario o Cédula</label>
                                <input type="text" class="form-control" id="login-usuario" name="usuario" required placeholder="Ej: admin o 12345678">
                            </div>
                            <div class="mb-4">
                                <label for="login-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="login-password" name="password" required placeholder="********">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="btn-login">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    Ingresar al Simulador
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Register -->
                    <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                        <form id="form-register">
                            <input type="hidden" name="action" value="register">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="reg-nombre" class="form-label">Nombre Completo</label>
                                    <input type="text" class="form-control" id="reg-nombre" name="nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="reg-cedula" class="form-label">Cédula</label>
                                    <input type="text" class="form-control" id="reg-cedula" name="cedula" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="reg-usuario" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="reg-usuario" name="usuario" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="reg-cargo" class="form-label">Cargo</label>
                                    <select class="form-control" id="reg-cargo" name="cargo" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Operador">Operador</option>
                                        <option value="Ingeniero">Ingeniero de Procesos</option>
                                        <option value="Auxiliar de sistemas">Auxiliar de sistemas</option>
                                        <option value="Administrador">Administrador</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="reg-correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="reg-correo" name="correo" required>
                            </div>
                            <div class="mb-4">
                                <label for="reg-password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="reg-password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="btn-register">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    Crear Cuenta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-muted small">&copy; 2026 Simulador de Secado Multigrano. Todos los derechos reservados.</p>
            </div>

        </div>
    </div>
</div>
