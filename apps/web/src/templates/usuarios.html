

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold"><i class="fas fa-users-cog me-2 text-primary"></i>Gestión de Usuarios</h3>
    
    <button class="btn btn-primary" onclick="abrirModalCrear()">
        <i class="fas fa-user-plus me-2"></i>Nuevo Usuario
    </button>
    
</div>

<div class="dashboard-card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-custom mb-0 align-middle" id="tabla-usuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Cédula</th>
                        <th>Correo</th>
                        <th>Cargo</th>
                        
                        <th class="text-center">Acciones</th>
                        
                    </tr>
                </thead>
                <tbody>
                    <!-- Contenido dinámico cargado por AJAX -->
                    <tr><td colspan="7" class="text-center py-4">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Formulario Usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-usuario">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalUsuarioTitle">Nuevo Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="usr_id" name="id" value="">
            
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="usr_nombre" name="nombre" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cédula</label>
                    <input type="text" class="form-control" id="usr_cedula" name="cedula" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Usuario (Login)</label>
                    <input type="text" class="form-control" id="usr_usuario" name="usuario" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="usr_correo" name="correo" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cargo</label>
                    <select class="form-select" id="usr_cargo" name="cargo" required>
                        <option value="">Seleccione...</option>
                        <option value="Operador">Operador</option>
                        <option value="Ingeniero">Ingeniero de Procesos</option>
                        <option value="Auxiliar de sistemas">Auxiliar de sistemas</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" id="lbl_contrasena">Contraseña</label>
                    <input type="password" class="form-control" id="usr_password" name="password">
                    <small class="text-muted" id="help_password">Déjelo en blanco si no desea cambiarla.</small>
                </div>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btn-guardar-usr">Guardar</button>
          </div>
      </form>
    </div>
  </div>
</div>
