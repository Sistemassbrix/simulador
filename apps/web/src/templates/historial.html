


<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold"><i class="fas fa-history me-2 text-primary"></i>Historial de Escenarios</h3>
        <div>
            <button class="btn btn-outline-warning me-2" onclick="limpiarHistorial()">
                <i class="fas fa-trash-alt me-2"></i>Limpiar Historial
            </button>
            <button class="btn btn-outline-danger me-2" onclick="exportarPDF()">
                <i class="fas fa-file-pdf me-2"></i>Exportar PDF
            </button>
            <button class="btn btn-outline-success" onclick="exportarCSV()">
                <i class="fas fa-file-csv me-2"></i>Exportar CSV
            </button>
        </div>
    </div>

    <div id="historial-admin-stats"></div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tablaHistorial">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3 border-0">USUARIO</th>
                        <th class="border-0">NOMBRE ESCENARIO</th>
                        <th class="border-0">TIPO</th>
                        <th class="border-0">FECHA</th>
                        <th class="border-0 text-center">ESTADO</th>
                        <th class="border-0 text-center">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">Cargando historial...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
