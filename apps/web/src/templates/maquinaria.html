

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold" id="titulo-maquinaria"><i class="fas fa-tractor me-2 text-primary"></i>Gestión de Maquinaria</h3>
    <div>
        <button class="btn btn-outline-secondary me-2 d-none" id="btn-volver" onclick="mostrarCategorias()">
            <i class="fas fa-arrow-left me-2"></i>Volver
        </button>
        
        <button class="btn btn-primary d-none" id="btn-nueva-maquina" onclick="abrirModalCrear()">
            <i class="fas fa-plus me-2"></i>Nueva Máquina
        </button>
        
    </div>
</div>

<!-- Vista de Categorías -->
<div id="vista-categorias" class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0 bg-white" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" onclick="mostrarTablaCategoria('Secadoras')">
            <div class="card-body text-center py-5">
                <i class="fas fa-fan fa-4x text-primary mb-3"></i>
                <h4 class="card-title fw-bold">Secadoras</h4>
                <p class="card-text text-muted">Gestión de torres de secado, caudal de aire y holding.</p>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0 bg-white" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" onclick="mostrarTablaCategoria('Transportadores')">
            <div class="card-body text-center py-5">
                <i class="fas fa-truck-loading fa-4x text-success mb-3"></i>
                <h4 class="card-title fw-bold">Transportadores</h4>
                <p class="card-text text-muted">Gestión de transportadores (Próximamente)</p>
            </div>
        </div>
    </div>
    <!-- Puedes añadir más tarjetas aquí en el futuro -->
</div>

<!-- Vista de Tabla (Oculta inicialmente) -->
<div class="dashboard-card d-none" id="vista-tabla">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-custom mb-0 align-middle" id="tabla-maquinaria">
                <thead>
                    <tr>
                        <th width="5%">ID</th>
                        <th width="10%">Cuerpo (S/D)</th>
                        <th width="30%">Equipo modelo de la Torre</th>
                        <th width="20%">Caudal aire de la torre (m³/h)</th>
                        <th width="20%">Holding de la Torre (m³)</th>
                        
                        <th width="15%" class="text-center">Acciones</th>
                        
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" class="text-center py-4">Cargando maquinaria...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Formulario -->
<div class="modal fade" id="modalMaquinaria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content shadow-lg border-0" style="background-color: #ffffff !important; background: #ffffff !important;">
      <form id="form-maquinaria">
          <div class="modal-header bg-white border-bottom py-3">
            <h5 class="modal-title fw-bold text-dark" id="modalMaquinariaTitle">Nueva Máquina</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4" style="background-color: #ffffff !important; background: #ffffff !important;">
            <input type="hidden" id="maquinaria_id" name="id" value="">
            <div class="mb-3">
                <label class="form-label fw-semibold">Cuerpo (S/D)</label>
                <select class="form-select" id="maquinaria_cuerpo" name="cuerpo" required>
                    <option value="S">S (Simple)</option>
                    <option value="D">D (Doble)</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Equipo modelo de la Torre</label>
                <input type="text" class="form-control" id="maquinaria_nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Caudal aire de la torre (m³/h)</label>
                <input type="number" step="0.01" class="form-control" id="maquinaria_caudal_aire" name="caudal_aire" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Holding de la Torre (m³)</label>
                <input type="number" step="0.01" class="form-control" id="maquinaria_holding" name="holding" required>
            </div>
          </div>
          <div class="modal-footer bg-light border-top">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary fw-bold px-4" id="btn-guardar-maquinaria">Guardar</button>
          </div>
      </form>
    </div>
  </div>
</div>
